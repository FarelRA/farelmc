# FarelMC dev compose runs the stack on bare metal for local testing (prod lives in nodus-infra,
# which pulls ghcr.io/farelra/farelmc and fronts BlueMap + ACME via Traefik).
# Usage: cp .env.example .env && ./scripts/download-mods.sh && docker compose up --build
services:
  minecraft:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farelmc-dev
    restart: unless-stopped
    stop_grace_period: 120s
    ports:
      # 25565 is Java Edition. 24454 UDP is Simple Voice Chat.
      # 8100 is the BlueMap web map in dev (prod serves it through Traefik).
      # 19132 UDP is Geyser Bedrock RakNet gameplay.
      # 19132 TCP is Geyser NetherNet signaling.
      # 19133 UDP is Geyser NetherNet gameplay over WebRTC.
      - "25565:25565"
      - "24454:24454/udp"
      - "8100:8100"
      - "19132:19132/udp"
      - "19132:19132/tcp"
      - "19133:19133/udp"
    volumes:
      - ./data:/data
      - ./config:/server/config
      - ./server.properties:/server/server.properties:ro
      - ./eula.txt:/server/eula.txt:ro
    environment:
      HEAP_GB: "4"
      TZ: Asia/Jakarta
    stdin_open: true
    tty: true
