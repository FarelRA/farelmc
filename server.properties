# These are the Minecraft server properties. They are the GROUND TRUTH for the cozy Farel friends SMP.
# Secrets NEVER live here: RCON_PASSWORD + MGMT_SECRET come from the container
# env at boot (nodus-infra data/minecraft/.env). rate-limit is a gentle flood
# guard (Geyser-safe high value; vanilla spam guards below handle chatter).
#Mod Sat Oct 24 2026 by Farel. Hardened for the friends SMP with survival QoL
