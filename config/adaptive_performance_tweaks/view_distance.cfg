#View Distance Feature Configuration
#
# Dynamically adjusts chunk view distance for all players based on server load.
# Values are chunk counts. Min: 4, Max: 32.
# This is a safety valve - only enable if view distance causes measurable lag.
#
# Steady-state load reduction only engages at minOptimizationLoadLevel (default MEDIUM) and
# above; below that view distance stays at the server default. Warmup temporarily lowers
# view distance on login/teleport and during fast movement at any load. Recovery is
# throttled (hysteresis) to avoid client-side chunk reloads from frequent view distance
# changes.
# recoveryMinDelayTicks acts as a hard floor for both the normal and the fast recovery
# path: lower recoveryDelayTicks/recoveryFastDelayTicks values have no effect below it.
# The movement warmup is speed based and measured in horizontal blocks per second.
# Vertical movement is ignored, since falling does not move the chunk frontier.
# Reference speeds: walking 4.3, sprinting 5.6, horse 5-15, elytra 20-30, boat on ice 40.
#   movementSpeedBlocksPerSecond     -> reduction of 1 (exploration)
#   movementFastSpeedBlocksPerSecond -> movementReductionMax (fast transit)
# loginWarmupReductionMax limits how many chunks a login or teleport warmup removes at once.
# A very large value restores the former behaviour of dropping straight to viewDistanceMin,
# which leaves a large empty area on the horizon instead of a thin ring.
# preventClientChunkReload applies every change to the levels directly instead of announcing
# a new chunk radius to the clients, so clients stop rebuilding all visible chunks on each
# change. Clients keep the already received chunks cached, which costs client side memory.
# Set it to false to get the previous client side render distance reduction back.
#Fri Oct 23 19:33:35 WIB 2026
enabled=auto
evaluationIntervalTicks=20
loginWarmupEnabled=true
loginWarmupReductionMax=3
loginWarmupTicks=60
minOptimizationLoadLevel=auto
movementFastSpeedBlocksPerSecond=20
movementReductionMax=2
movementSpeedBlocksPerSecond=5
movementWarmupEnabled=true
preventClientChunkReload=true
recoveryDelayTicks=100
recoveryFastDelayTicks=40
recoveryFastStepTicks=20
recoveryMinDelayTicks=100
recoveryStepTicks=100
viewDistanceHigh=6
viewDistanceLow=10
viewDistanceMax=12
viewDistanceMedium=8
viewDistanceMin=4
viewDistanceNormal=10
viewDistanceVeryHigh=4
viewDistanceVeryLow=12
